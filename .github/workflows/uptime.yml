# Watches Moonlight's events server and tells the owner's phone (ntfy) when it stops answering,
# and again when it's back. Lives in the public pages repo, moonlight-work/moonlightjob, because
# scheduled runs there cost no Actions minutes; the main repo is private. Source of truth:
# site/.github/workflows/uptime.yml in moonlight-work/moonlight, copied with the rest of site/.
#
# Down means either:
#   - /health doesn't answer {"ok":true}, or
#   - Chicago's events, three days out, come back empty, failed, or older than 36 hours (the national
#     catalog stopped crawling and the per-area fallback isn't answering either).
# The events window starts three days out, so the server's ninety-minute live check never fires
# and the watcher costs no Ticketmaster calls.
#
# One alert when it goes down, a reminder every three hours while it stays down, one when it's back.
# The state is this workflow's own last run: a run fails when the server is down.
#
# Secret: NTFY_TOPIC (the owner's topic name only, set by the owner; never printed).
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert to the phone"
        type: boolean
        default: false

permissions:
  actions: write   # read the last run; re-enable this schedule monthly (GitHub pauses idle repos' schedules after 60 days)
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the server
        id: check
        run: |
          base=https://moonlightjob-api.fly.dev
          probe() {
            health=$(curl -s -m 15 "$base/health" || true)
            [ "$health" = '{"ok":true}' ] || { echo "health answered: ${health:-nothing}"; return 1; }
            start=$(date -u -d '+3 days' +%Y-%m-%dT00:00:00Z); end=$(date -u -d '+4 days' +%Y-%m-%dT00:00:00Z)
            body=$(curl -s -m 30 "$base/v1/events?lat=41.88&lon=-87.63&radius=25&start=$start&end=$end" || true)
            echo "$body" | python3 -c '
          import json, sys, datetime as d
          try:
              f = json.load(sys.stdin)
          except Exception:
              sys.exit("events: no JSON")
          n = len(f.get("events", []))
          src = (f.get("sources") or [{}])[0]
          ok, note = src.get("ok"), src.get("note")
          age = (d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(f["fetchedAt"].replace("Z", "+00:00"))).total_seconds() / 3600
          print(f"events: {n} in Chicago, Ticketmaster ok={ok} note={note}, {age:.1f} h old")
          if n == 0 or age > 36:
              sys.exit(1)'
          }
          if probe; then echo "state=up" >> "$GITHUB_OUTPUT"; exit 0; fi
          sleep 45   # one retry, so a deploy's restart isn't an outage
          if probe; then echo "state=up" >> "$GITHUB_OUTPUT"; else echo "state=down" >> "$GITHUB_OUTPUT"; fi

      - name: Tell the owner when the state changes
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE: ${{ steps.check.outputs.state }}
        run: |
          # The last finished scheduled run before this one: failure means the server was down then.
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "success"')
          was=$([ "$last" = failure ] && echo down || echo up)
          send() {
            [ -n "$NTFY_TOPIC" ] || { echo "::warning::NTFY_TOPIC isn't set; no alert sent"; return 0; }
            curl -s -o /dev/null -H "Title: Moonlight server" -H "Priority: $2" -H "Tags: $3" -d "$1" "https://ntfy.sh/$NTFY_TOPIC" || echo "::warning::ntfy didn't answer"
          }
          if [ "$STATE" = down ] && [ "$was" = up ]; then
            send "The events server isn't answering (moonlightjob-api.fly.dev). Run: flyctl status -a moonlightjob-api" high warning
          elif [ "$STATE" = down ] && [ $(( 10#$(date -u +%H) % 3 )) -eq 0 ] && [ $(( 10#$(date -u +%M) )) -lt 10 ]; then
            send "Still down. flyctl logs -a moonlightjob-api" high warning
          elif [ "$STATE" = up ] && [ "$was" = down ]; then
            send "The events server is answering again." default white_check_mark
          fi
          if [ "${{ inputs.test }}" = true ]; then
            send "Test: the uptime watcher can reach you. The server is $STATE." default bell
          fi
          echo "was $was, now $STATE"

      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Once a month, so GitHub never pauses the schedule for a repo without commits.
          if [ "$(date -u +%d%H)" = "0100" ] && [ "$(date -u +%M)" -lt 10 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/uptime.yml/enable" && echo "re-enabled"
          fi

      - name: Fail the run while the server is down
        if: steps.check.outputs.state == 'down'
        run: exit 1
